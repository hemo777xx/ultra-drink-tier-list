<!DOCTYPE html>
<html lang="ru" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Создавай свои тир-листы напитков! Загружай фото, перетаскивай и делись с друзьями.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="🍺 Drink Tier List">
    <meta property="og:description" content="Загружай фото напитков и оценивай их!">
    <meta property="og:type" content="website">
    
    <!-- Favicon (Base64 Beer Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

    <title>🍺 Drink Tier List</title>
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <span class="header__title">🍺 Drink Tier List</span>
                <p class="header__subtitle">Загружай фото напитков и оценивай их!</p>
            </div>
            <div class="header__actions">
                <button class="btn btn--icon" id="shareBtn" title="Поделиться">
                    <i class="fas fa-share-nodes"></i>
                </button>
                <button class="btn btn--icon" id="exportBtn" title="Экспорт в PNG">
                    <i class="fas fa-download"></i>
                </button>
                <button class="btn btn--icon" id="themeToggle" title="Сменить тему">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn btn--danger" id="clearBtn" title="Очистить всё">
                    <i class="fas fa-trash"></i> <span class="btn__text">Очистить</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main">
        <!-- Зона загрузки -->
        <section class="upload-section">
            <div class="upload-zone" id="uploadZone">
                <i class="fas fa-cloud-arrow-up upload-zone__icon"></i>
                <h3 class="upload-zone__title">Перетащи фото сюда или нажми для выбора</h3>
                <p class="upload-zone__hint">Поддерживаются: .jpg, .png, .webp (до 5 МБ)</p>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
            </div>

            <!-- ===== НОВЫЙ БЛОК: Добавление по ссылке ===== -->
            <div class="url-input-container" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                <input type="url" id="urlInput" placeholder="Вставьте ссылку на фото..." 
                       style="flex: 1; padding: 0.75rem; border-radius: var(--radius); border: 1px solid var(--color-border); background: var(--color-surface-alt); color: var(--color-text);">
                <button class="btn btn--primary" id="addUrlBtn" style="background: var(--color-primary); color: #000;">
                    <i class="fas fa-plus"></i> Добавить
                </button>
            </div>
            <!-- ===== КОНЕЦ НОВОГО БЛОКА ===== -->

            <div class="progress-container" id="progressContainer" hidden>
                <div class="progress-bar">
                    <div class="progress-bar__fill" id="progressBarFill"></div>
                </div>
                <span class="progress-text" id="progressText">0%</span>
            </div>
        </section>

        <!-- Тир-лист -->
        <section class="tier-list" id="tierList">
            <!-- Уровни генерируются JS -->
        </section>

        <!-- Библиотека -->
        <section class="library">
            <h2 class="library__title"><i class="fas fa-images"></i> Библиотека</h2>
            <div class="library__grid" id="libraryGrid">
                <!-- Фото из библиотеки -->
            </div>
            <div class="empty-state" id="emptyState">
                <i class="fas fa-mug-saucer"></i>
                <p>Пока нет фото. Загрузи первое!</p>
            </div>
        </section>
    </main>

    <!-- Модальное окно для мобильного выбора тира -->
    <div class="modal" id="tierModal">
        <div class="modal__content">
            <h3 class="modal__title">Выбери уровень</h3>
            <div class="modal__tiers" id="modalTiers"></div>
            <button class="btn btn--secondary" id="closeModalBtn">Отмена</button>
        </div>
    </div>

    <!-- Уведомления (Toasts) -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>

    <!-- Клиентский JS -->
    <script type="module" src="script.js"></script>
</body>
</html>
